# YOLOv11 Augmentations Configuration File
# Este archivo define las técnicas de aumento de datos que se aplicarán durante el entrenamiento.
hsv_s: 0.5              # Predeterminado: 0.7 | Rango (0.0 - 1.0) | Descripción: Altera la saturación de la imagen en una fracción, afectando la intensidad de los colores. Útil para simular diferentes condiciones ambientales.
hsv_h: 0.1              # Predeterminado: 0.015 | Rango (0.0 - 1.0) | Descripción: Ajusta el tono (hue) de la imagen en una fracción del círculo cromático, introduciendo variabilidad de color. Ayuda al modelo a generalizar bajo distintas condiciones de iluminación.
hsv_v: 0.9              # Predeterminado: 0.4 | Rango (0.0 - 1.0) | Descripción: Modifica el valor (brillo) de la imagen en una fracción, ayudando al modelo a rendir bien bajo diversas condiciones de iluminación.
degrees: 90             # Predeterminado: 0.0 | Rango (0.0 - 180) | Descripción: Rota la imagen aleatoriamente dentro del rango de grados especificado, mejorando la capacidad del modelo para reconocer objetos en diversas orientaciones.
translate: 0.0          # Predeterminado: 0.1 | Rango (0.0 - 1.0) | Descripción: Desplaza la imagen horizontal y verticalmente en una fracción del tamaño de la imagen, ayudando a aprender a detectar objetos parcialmente visibles.
scale: 0.2         # Predeterminado: 0.5 | Rango (>=0.0) | Descripción: Escala la imagen mediante un factor de ganancia, simulando objetos a distintas distancias de la cámara.
shear: 0              # Predeterminado: 0.0 | Rango (-180 - +180) | Descripción: Cizalla (shear) la imagen en el grado especificado, imitando el efecto de observar objetos desde diferentes ángulos.
perspective: 0.0        # Predeterminado: 0.0 | Rango (0.0 - 0.001) | Descripción: Aplica una transformación de perspectiva aleatoria a la imagen, mejorando la capacidad del modelo para comprender objetos en el espacio 3D.
flipud: 0.5             # Predeterminado: 0.0 | Rango (0.0 - 1.0) | Descripción: Voltea la imagen verticalmente (arriba/abajo) con la probabilidad especificada, aumentando la variabilidad de datos sin afectar las características del objeto.
fliplr: 0.5             # Predeterminado: 0.5 | Rango (0.0 - 1.0) | Descripción: Voltea la imagen horizontalmente (izquierda/derecha) con la probabilidad especificada, útil para aprender objetos simétricos y aumentar la diversidad del conjunto de datos.
bgr: 0.0                # Predeterminado: 0.0 | Rango (0.0 - 1.0) | Descripción: Invierte los canales de la imagen de RGB a BGR con la probabilidad especificada, útil para aumentar la robustez ante ordenamientos de canales incorrectos.
mosaic: 0.0            # Predeterminado: 1.0 | Rango (0.0 - 1.0) | Descripción: Combina cuatro imágenes de entrenamiento en una, simulando diferentes composiciones de escena e interacciones entre objetos. Altamente efectivo para la comprensión de escenas complejas.
mixup: 0.0              # Predeterminado: 0.0 | Rango (0.0 - 1.0) | Descripción: Mezcla dos imágenes y sus etiquetas, creando una imagen compuesta. Mejora la capacidad de generalización del modelo al introducir ruido de etiquetas y variabilidad visual.
cutmix: 0.0             # Predeterminado: 0.0 | Rango (0.0 - 1.0) | Descripción: Combina porciones de dos imágenes, creando una mezcla parcial manteniendo regiones distintas. Mejora la robustez del modelo al crear escenarios de oclusión.
copy_paste: 0.0         # Predeterminado: 0.0 | Rango (0.0 - 1.0) | Descripción: Solo segmentación. Copia y pega objetos entre imágenes para aumentar las instancias de objetos.
copy_paste_mode: 'flip' # Predeterminado: flip | Descripción: Solo segmentación. Especifica la estrategia de copy-paste a usar. Las opciones incluyen 'flip' y 'mixup'.
auto_augment: null      # Predeterminado: randaugment | Descripción: Solo clasificación. Aplica una política de aumentos predefinida ('randaugment', 'autoaugment' o 'augmix') para mejorar el rendimiento del modelo mediante diversidad visual.
erasing: 0.0            # Predeterminado: 0.4 | Rango (0.0 - 0.9) | Descripción: Solo clasificación. Borra aleatoriamente regiones de la imagen durante el entrenamiento para fomentar que el modelo se enfoque en características menos obvias.