[project]
name = "modulo-ia"
version = "0.2.0"
description = "Módulo IA - Agrupa todas las funcionalidades relacionadas con la inteligencia artificial, incluyendo entrenamiento, inferencia, evaluación y visualización de resultados."
readme = "README.md"
requires-python = ">=3.11, <3.12" # Versión adaptada GPU NVIDIA RTX 1060
dependencies = [
    "loguru>=0.7.3",
    # "numpy>=2.3.4", # Version original
    "modulo-utilidades",
    "numpy<2.0", # Versión adaptada para compatibilidad con pyTorch y otros paquetes
    "pandas>=2.3.3",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.11.0",
    "supervision==0.27.0",
    "ultralytics>=8.3.217",
]


[project.optional-dependencies]
development = [
    "tqdm>=4.67.1",
    "scikit-learn>=1.7.0",
    "fiftyone>=1.6.0",
    "mlflow>=3.1.1",
    "deprecated>=1.2.18",
    "sahi>=0.11.32",
    "ipykernel>=6.30.1",
    "torchvision>=0.22.1",
    "torch>=2.7.1",
    "python-dotenv>=1.1.1",
    "typer>=0.19.2",
    "gputil-fix>=1.4.1.2",
    "modulo-utilidades[development]",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# Advertencia: Hay que ver el CUDA que se va a utilizar en producción.
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
# modulo-utilidades = { path = "dist/modulo_utilidades-0.2.0-py3-none-any.whl" } # Producción (instalación desde wheel precompilado) - > uv sync
modulo-utilidades = { path = "../modulo-utilidades", editable = true } # Desarrollo local -> uv sync --all-extras


[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "modulo_ia"
module-root = ""
source-exclude = [
    "modulo_ia/utils",
    "modulo_ia/dataset.py",
    "modulo_ia/features.py",
    "modulo_ia/main.py",
    "modulo_ia/visualizations.py",
]
