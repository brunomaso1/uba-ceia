    <!-- Scripts -->

    <!-- Load HTML sections -->
    <script>
        // Function to load HTML content into sections
        async function loadSection(sectionId, filePath) {
            try {
                const response = await fetch(filePath);
                if (response.ok) {
                    const html = await response.text();
                    document.getElementById(sectionId).innerHTML = html;
                } else {
                    console.error(`Failed to load ${filePath}: ${response.status}`);
                }
            } catch (error) {
                console.error(`Error loading ${filePath}:`, error);
            }
        }

        // Load all sections when DOM is ready
        document.addEventListener('DOMContentLoaded', async function() {
            // Load sections
            await Promise.all([
                loadSection('header-section', 'sections/header.html'),
                loadSection('hero-section', 'sections/hero.html'),
                loadSection('cta-section', 'sections/cta.html'),
                loadSection('footer-section', 'sections/footer.html')
            ]);
            
            // Initialize page functionality after sections are loaded
            if (typeof window.initializePage === 'function') {
                window.initializePage();
            }
        });

        // Analytics placeholder (replace with your analytics code)
        if (typeof gtag !== 'undefined') {

    </script>
