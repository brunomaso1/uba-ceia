[project]
name = "fastapi-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11, <3.12" # Allow minor updates but not version updates

dependencies = [
    "fastapi-keycloak-middleware>=1.3.0",
    "fastapi[standard]>=0.119.1",
    "geopandas>=1.1.1",
    "loguru>=0.7.3",
    "modulo-ia>=0.1.0, <0.2.0", # Allow minor updates but not version updates
    "modulo-utilidades>=0.1.0, <0.2.0", # Allow minor updates but not version updates
    # "numpy>=2.3.4",
    "numpy<2.0", # Pytorch number compatibility issue
    # "opencv-python>=4.11.0.86", # Versión pesada, requiere libgl1
    "opencv-python-headless>=4.11.0.86", # Versión liviana, no requiere libgl1
    "pydantic>=2.12.3",
    "pydantic-settings>=2.11.0",
    # "torch>=2.9.0",
    "torch==2.1.2",
]

