[project]
name = "fastapi-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
# Agregar modulo-ia como dependencia editable desde la ruta local:
# uv add "modulo-ia @E:\Documentos\Git Repositories\uba-ceia-proy-final\ceia-proyecto-final\modulo-IA" --editable
# uv add "modulo-utilidades @E:\Documentos\Git Repositories\uba-ceia-proy-final\ceia-proyecto-final\modulo-utilidades" --editable
# NOTA: Para producción hay que agregar el Wheel de los modulos.
dependencies = [
    "fastapi-keycloak-middleware>=1.3.0",
    "fastapi[standard]>=0.119.1",
    "geopandas>=1.1.1",
    "loguru>=0.7.3",
    "modulo-ia",
    "modulo-utilidades",
    "numpy>=2.3.4",
    "opencv-python>=4.11.0.86",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.11.0",
    "torch>=2.9.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
# Advertencia: Hay que ver el CUDA que se va a utilizar en producción.
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
modulo-ia = { path = "../../../../modulo-IA", editable = true }
modulo-utilidades = { path = "../../../../modulo-utilidades", editable = true }
